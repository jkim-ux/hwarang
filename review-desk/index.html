</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';
  var FOLDER = 'application/vnd.google-apps.folder';
  var GDOC = 'application/vnd.google-apps.document';
  var DRIVE = 'Google Drive';
  var DEFAULT_RUBRIC = [
    '당신은 IB 디플로마 과정을 가르치는 교사의 조교입니다. 학생이 구글 문서로 제출한 숙제를 읽고 교사가 빠르게 파악할 수 있는 리뷰를 작성하세요.',
    '',
    '평가 관점:',
    '1. 과제 요구를 충족했는가 (완성도, 분량, 질문에 실제로 답했는가)',
    '2. 내용의 정확성 — 교과 개념·용어(경제학, 경영학, 심리학, 정치학 등)를 바르게 사용했는가, 사실 오류나 오개념이 있는가',

    '4. 표현 — 학술적 영어 문장, 용어의 정확성 (문법은 의미를 해치는 경우만 지적)',
    '',
    '규칙:',
    '- 리뷰는 한국어로 쓰되, 학생 글을 인용할 때는 원문(영어)을 그대로 짧게 인용합니다.',
    '- 좋은 점보다 고칠 점을 구체적으로: 무엇이 왜 부족한지, 어떻게 고치면 되는지.',
    '- 점수는 0~10 정수. 8 이상은 거의 수정 없이 통과, 5~7은 보완 필요, 4 이하는 다시 써야 하는 수준.',

  ].join('\n');
  var ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>';
  var ICON_DOC = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>';
  var ICON_FOLDER = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>';
  var ICON_INBOX = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9 6 9-6"></path><rect x="3" y="5" width="18" height="14"></rect></svg>';
  var ICON_ALERT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>';
  var ICON_BACK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>';

  var state = {
    db: null, mcp: null, sample: null, capsReady: false,
    config: null, reviews: {}, runs: [], roster: {}, assignments: {},
    view: 'unseen', subject: 'all', q: '', selected: null, selectedStudent: null,
    keep: {}, assignSel: {}, running: false, pane: 'list'
  };
  var draftFolders = [];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(iso, opts) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return '—';
    var o = opts || { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
    o.timeZone = 'Asia/Seoul';
    return d.toLocaleString('ko-KR', o).replace(/\.\s*$/, '').replace(/\.\s+/g, '.').replace(/\.(\d{2}:)/, ' $1');
  }
  function fmtTime(iso) { return fmt(iso, { hour: '2-digit', minute: '2-digit', hour12: false }); }
  function dayKey(iso) { return iso ? new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }) : '0000'; }
  function dayLabel(iso) { return fmt(iso, { month: 'long', day: 'numeric', weekday: 'long' }); }
  function today() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }); }
  var toastTimer = null;
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, ms || 3200); }
  function notice(msg, crit) { var n = $('notice'); if (!msg) { n.hidden = true; return; } n.textContent = msg; n.className = 'notice' + (crit ? ' crit' : ''); n.hidden = false; }
  function use(name) { try { if (window.claude && typeof window.claude.use === 'function') return window.claude.use(name); } catch (e) { /* none */ } return Promise.resolve(null); }

  /* ---------- config helpers ---------- */
  function cfg() {
    var c = state.config || {};
    return {
      folders: Array.isArray(c.folders) ? c.folders.filter(function (f) { return f && f.id; }).map(function (f) { return { id: f.id, name: f.name || '', label: f.label || '' }; }) : [],
      exclude: Array.isArray(c.exclude) ? c.exclude : ['자료실', '비공개'],
      sinceDays: Number(c.sinceDays) > 0 ? Number(c.sinceDays) : 14,
      minChars: Number(c.minChars) >= 0 ? Number(c.minChars) : 40,
      rubric: typeof c.rubric === 'string' && c.rubric.trim() ? c.rubric : DEFAULT_RUBRIC,
      materialsPattern: (c.materialsPattern || '자료실').trim(),
      homeworkPattern: (c.homeworkPattern || 'Homework').trim()
    };
  }
  function folderById(id) { var fs = cfg().folders; for (var i = 0; i < fs.length; i++) if (fs[i].id === id) return fs[i]; return null; }
  function label(f) { return f.label || f.name || f.id; }
  function inFolder(r, f) { if (!f) return true; if (r.folderId) return r.folderId === f.id; return !!f.name && r.folderName === f.name; }
  function allReviews() { return Object.keys(state.reviews).map(function (k) { return state.reviews[k]; }); }
  function scoreClass(r) { if (!r || r.status === 'empty' || typeof r.score !== 'number') return 'none'; return r.score >= 8 ? 'good' : r.score >= 5 ? 'warn' : 'crit'; }
  function isFlagged(r) { return (r.flags && r.flags.length) || (typeof r.score === 'number' && r.score < 5); }
  function cmpRecent(a, b) { return String(b.modifiedTime || '').localeCompare(String(a.modifiedTime || '')); }
  function assignmentsFor(folderId) { var a = state.assignments[folderId]; return a && Array.isArray(a.items) ? a.items.slice().sort(function (x, y) { return String(y.due || '').localeCompare(String(x.due || '')); }) : []; }
  function currentAssignment(folderId) {
    var items = assignmentsFor(folderId); if (!items.length) return null;
    var sel = state.assignSel[folderId]; if (sel) for (var i = 0; i < items.length; i++) if (items[i].id === sel) return items[i];
    var t = today(); var soon = new Date(Date.now() + 3 * 86400000).toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });
    for (var j = 0; j < items.length; j++) if (items[j].due && items[j].due <= soon) return items[j];
    return items[items.length - 1] || null;
  }
  function guessAssignment(items, modifiedTime) {
    if (!items || !items.length || !modifiedTime) return null;
    var m = new Date(modifiedTime).getTime(); var best = null; var bestD = Infinity;
    items.forEach(function (a) {
      if (!a.due) return; var d = new Date(a.due + 'T23:59:59+09:00').getTime();
      var late = m - d; if (late > 10 * 86400000) return;
      var dist = Math.abs(late); if (dist < bestD) { bestD = dist; best = a; }
    });
    return best;
  }
  function reviewAssignment(r) {
    if (r.assignmentId) return { id: r.assignmentId, name: r.assignmentName || '', due: r.assignmentDue || '' };
    var g = guessAssignment(assignmentsFor(r.folderId), r.modifiedTime); return g ? { id: g.id, name: g.name, due: g.due, guessed: true } : null;
  }

  /* ---------- boot ---------- */
  try { var saved = JSON.parse(localStorage.getItem('reviewDesk.ui') || '{}'); if (saved.view) state.view = saved.view; if (saved.subject) state.subject = saved.subject; } catch (e) { /* ignore */ }
  render(); bindUI();
  Promise.all([use('db'), use('mcp'), use('sample')]).then(function (caps) {
    state.db = caps[0]; state.mcp = caps[1]; state.sample = caps[2]; state.capsReady = true;
    if (!state.db) { notice('이 페이지는 claude.ai 안에서 열어야 리뷰 데이터를 불러올 수 있습니다.', true); render(); return; }
    subscribe();
    if (!state.mcp || !state.sample) notice('이 화면에서는 드라이브 연결 또는 Claude 리뷰를 쓸 수 없어 "지금 확인하기"가 동작하지 않습니다. 자동 확인 결과는 계속 보입니다.');
    render();
  });
  function subscribe() {
    var db = state.db;
    db.doc('config/main').onSnapshot(function (s) { state.config = s.exists ? s.data() : null; render(); }, function (e) { toast('설정을 읽지 못했습니다: ' + e.message); });
    db.collection('reviews').onSnapshot(function (s) { var m = {}; s.docs.forEach(function (d) { var x = d.data() || {}; var k = x.fileId || String(d.id).split('/').pop(); if (!x.fileId) x.fileId = k; m[k] = x; }); state.reviews = m; render(); }, function (e) { toast('리뷰를 읽지 못했습니다: ' + e.message); });
    db.collection('runs').orderBy('startedAt', 'desc').limit(10).onSnapshot(function (s) { state.runs = s.docs.map(function (d) { return d.data(); }); render(); }, function () {});
    db.collection('roster').onSnapshot(function (s) { var m = {}; s.docs.forEach(function (d) { var x = d.data() || {}; m[x.folderId || String(d.id).split('/').pop()] = x; }); state.roster = m; render(); }, function () {});
    db.collection('assignments').onSnapshot(function (s) { var m = {}; s.docs.forEach(function (d) { var x = d.data() || {}; m[x.folderId || String(d.id).split('/').pop()] = x; }); state.assignments = m; render(); }, function () {});
  }
  function persistUI() { try { localStorage.setItem('reviewDesk.ui', JSON.stringify({ view: state.view, subject: state.subject })); } catch (e) { /* ignore */ } }

  /* ---------- derived lists ---------- */
  function subjectFolder() { return state.subject === 'all' ? null : folderById(state.subject); }
  function reviewsInScope() { var f = subjectFolder(); return allReviews().filter(function (r) { return inFolder(r, f); }); }
  function listReviews() {
    var q = state.q.trim().toLowerCase();
    return reviewsInScope().filter(function (r) {
      if (state.view === 'unseen' && r.seen && !state.keep[r.fileId]) return false;
      if (state.view === 'seen' && !r.seen) return false;
      if (q && !((r.student || '') + ' ' + (r.title || '') + ' ' + (r.folderName || '')).toLowerCase().includes(q)) return false;
      return true;
    }).sort(cmpRecent);
  }
  function missingRows() {
    var fs = subjectFolder() ? [subjectFolder()] : cfg().folders; var out = [];
    fs.forEach(function (f) {
      var ro = state.roster[f.id]; var students = ro && Array.isArray(ro.students) ? ro.students : [];
      if (!students.length) return;
      var a = currentAssignment(f.id);
      var byStudent = {}; allReviews().filter(function (r) { return inFolder(r, f); }).forEach(function (r) { var k = r.student || ''; (byStudent[k] = byStudent[k] || []).push(r); });
      students.forEach(function (s) {
        var mine = (byStudent[s.name] || []).sort(cmpRecent);
        var submitted = a ? mine.some(function (r) { var ra = reviewAssignment(r); return ra && ra.id === a.id; }) : mine.length > 0;
        if (submitted) return;
        var last = mine[0] || null;
        out.push({ key: f.id + ':' + s.name, folder: f, student: s, assignment: a, history: mine, last: last, never: !mine.length });
      });
    });
    var q = state.q.trim().toLowerCase();
    if (q) out = out.filter(function (m) { return (m.student.name + ' ' + m.folder.name).toLowerCase().includes(q); });
    return out;
  }
  function missingCount() { var s = state.subject; state.subject = 'all'; var n = 0; try { n = missingRows().length; } catch (e) { n = 0; } state.subject = s; return n; }

  /* ---------- render ---------- */
  function render() {
    var c = cfg(); var all = allReviews(); var f = subjectFolder();
    if (state.subject !== 'all' && !f) { state.subject = 'all'; }
    var unseenAll = all.filter(function (r) { return !r.seen; }).length;
    var seenAll = all.length - unseenAll;
    var missingAll = missingCount();

    // rail: views
    var views = [
      { id: 'unseen', icon: ICON_INBOX, t: '확인 안 함', n: unseenAll, cls: unseenAll ? 'hot' : 'zero' },
      { id: 'missing', icon: ICON_ALERT, t: '미제출자', n: missingAll, cls: missingAll ? 'crit' : 'zero' },
      { id: 'seen', icon: ICON_CHECK, t: '확인함', n: seenAll, cls: seenAll ? '' : 'zero' }
    ];
    $('views').innerHTML = views.map(function (v) {
      return '<button class="item" type="button" data-view="' + v.id + '" aria-current="' + (state.view === v.id) + '">' + v.icon + '<span class="t">' + v.t + '</span><span class="cnt ' + v.cls + '">' + v.n + '</span></button>';
    }).join('');
    // rail: subjects
    var sub = '<button class="item" type="button" data-subject="all" aria-current="' + (state.subject === 'all') + '"><span class="t">전체</span><span class="cnt ' + (unseenAll ? '' : 'zero') + '">' + unseenAll + '</span></button>';
    c.folders.forEach(function (fo) {
      var n = all.filter(function (r) { return !r.seen && inFolder(r, fo); }).length;
      sub += '<button class="item" type="button" data-subject="' + esc(fo.id) + '" aria-current="' + (state.subject === fo.id) + '" title="' + esc(fo.name) + '"><span class="t">' + esc(label(fo)) + '</span><span class="cnt ' + (n ? 'hot' : 'zero') + '">' + n + '</span></button>';
    });
    if (!c.folders.length) sub += '<div class="empty" style="padding:12px 24px;text-align:left">설정에서 과목 폴더를 추가하세요.</div>';
    $('subjects').innerHTML = sub;
    // rail: foot
    var last = state.runs[0];
    $('lastRun').textContent = last ? fmt(last.finishedAt || last.startedAt) + (last.source === 'scheduled' ? ' 자동' : ' 수동') : '아직 없음';
    var canRun = state.capsReady && state.db && state.mcp && state.sample && !state.running && c.folders.length;
    $('runBtn').disabled = !canRun;
    $('runBtn').innerHTML = state.running ? '<span class="spin"></span><span>확인 중…</span>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg><span>지금 확인하기' + (f ? ' · ' + esc(label(f)) : '') + '</span>';
    $('bandSub').textContent = (c.folders.length ? c.folders.length + '개 과목 감시 중' : '2026 Fall') + ' · v6';

    // list
    var titleMap = { unseen: '확인 안 함', missing: '미제출자', seen: '확인함' };
    $('listTitle').firstChild.nodeValue = titleMap[state.view] + ' ';
    var tools = '';
    if (state.view === 'missing') {
      if (f) {
        var items = assignmentsFor(f.id); var cur = currentAssignment(f.id);
        tools += '<select id="assignSel" aria-label="과제 선택">' + (items.length ? items.map(function (a) { return '<option value="' + esc(a.id) + '"' + (cur && cur.id === a.id ? ' selected' : '') + '>' + esc(a.name) + (a.due ? ' · ' + a.due.slice(5).replace('-', '/') : '') + '</option>'; }).join('') : '<option>과제 폴더 없음 · 최근 ' + c.sinceDays + '일 기준</option>') + '</select>';
      } else {
        tools += '<span class="chip-btn" aria-pressed="true">과목별 최근 과제 기준</span>';
      }
    } else {
      tools += '<button class="chip-btn" type="button" id="flagOnly" aria-pressed="' + (state.flagOnly ? 'true' : 'false') + '">주의만</button>';
    }
    tools += '<span class="grow"></span><input type="search" id="q" placeholder="검색" aria-label="검색" value="' + esc(state.q) + '" style="width:140px">';
    $('listTools').innerHTML = tools;

    var rowsHtml = '';
    if (state.view === 'missing') {
      var ms = missingRows();
      $('listSub').textContent = (f ? label(f) : '전체 과목') + ' · ' + ms.length + '명';
      if (!ms.length) rowsHtml = '<div class="empty">' + (Object.keys(state.roster).length ? '미제출자가 없습니다.' : '학생 명단이 아직 없습니다. <b>지금 확인하기</b>를 한 번 실행하면 학생 폴더와 과제 폴더를 읽어 옵니다.') + '</div>';
      else {
        var never = ms.filter(function (m) { return m.never; }); var lapsed = ms.filter(function (m) { return !m.never; });
        var block = function (title, arr) {
          if (!arr.length) return '';
          return '<div class="day">' + title + ' · ' + arr.length + '</div>' + arr.map(function (m) {
            var l2 = m.never ? '폴더에 문서 없음' : (m.last ? fmt(m.last.modifiedTime, { month: 'numeric', day: 'numeric' }) + ' ' + esc(m.last.title) + (typeof m.last.score === 'number' ? ' ' + m.last.score + '점' : '') + ' · 이번 과제 없음' : '');
            return '<button class="row" type="button" data-missing="' + esc(m.key) + '" aria-current="' + (state.selectedStudent === m.key) + '"><div class="sq none">없음</div><div class="body"><div class="l1"><div class="who">' + esc(m.student.name) + (!f ? ' <span class="tag subj">' + esc(label(m.folder)) + '</span>' : '') + '</div><div class="when">' + (m.assignment ? esc(m.assignment.name) : '') + '</div></div><div class="l2">' + l2 + '</div></div></button>';
          }).join('');
        };
        rowsHtml = block('한 번도 안 낸 학생', never) + block('지난 과제는 냈는데 이번엔 안 냄', lapsed);
      }
    } else {
      var list = listReviews(); if (state.flagOnly) list = list.filter(isFlagged);
      $('listSub').textContent = (f ? label(f) : '전체 과목') + ' · ' + list.length + '건';
      if (!list.length) {
        rowsHtml = '<div class="empty">' + (state.view === 'unseen'
          ? (all.length ? '확인하지 않은 리뷰가 없습니다.' : (c.folders.length ? '아직 리뷰가 없습니다. <b>지금 확인하기</b>를 누르거나 다음 자동 확인(08:00 · 17:00)을 기다리세요.' : '먼저 <b>설정</b>에서 과목 폴더를 추가하세요.'))
          : '아직 확인한 리뷰가 없습니다.') + '</div>';
      } else {
        var curDay = null;
        list.forEach(function (r) {
          var dk = dayKey(r.modifiedTime);
          if (dk !== curDay) { curDay = dk; rowsHtml += '<div class="day">' + (r.modifiedTime ? dayLabel(r.modifiedTime) + (dk === today() ? ' · 오늘' : '') : '날짜 없음') + '</div>'; }
          var sc = scoreClass(r);
          var right = (state.view === 'unseen' && r.seen) ? '<span class="tag moved">' + ICON_CHECK + '확인함으로 이동</span>' : '<div class="when">' + fmtTime(r.modifiedTime) + '</div>';
          var flags = (r.flags || []).map(function (x) { return '<span class="tag flag">' + esc(x) + '</span>'; }).join('');

  function shortLabel(name) {
    if (!name) return '';
    return name.replace(/\bEconomics\b/i, 'Econ').replace(/\bBusiness( Management)?\b/i, 'BM').replace(/\bPsychology\b/i, 'Psych').replace(/\bGlobal Politics\b/i, 'GloPo').replace(/\bSocial Science\b/i, 'SS').replace(/\bGrade\b/i, '').replace(/\bYR\s*/i, 'Y').replace(/\bIB\s+/i, '').replace(/\s+/g, ' ').trim();
  }
  function parseFolderId(s) { s = (s || '').trim(); var m = s.match(/\/folders\/([A-Za-z0-9_-]{10,})/) || s.match(/[?&]id=([A-Za-z0-9_-]{10,})/); if (m) return m[1]; if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s; return null; }
  function addFolder() {
    var id = parseFolderId($('folderInput').value);
    if (!id) { toast('폴더 링크나 ID 형식이 아닙니다.'); return; }
    if (draftFolders.some(function (f) { return f.id === id; })) { toast('이미 추가된 폴더입니다.'); return; }
    var btn = $('folderAdd'); btn.disabled = true; btn.textContent = '확인 중…';

    if (!state.mcp) { done(''); return; }
    state.mcp.server(DRIVE).then(function (drive) { return drive.get_file_metadata({ fileId: id, excludeContentSnippets: true }); }).then(function (meta) {
      if (meta && meta.mimeType && meta.mimeType !== FOLDER) { toast('폴더가 아니라 파일입니다: ' + (meta.title || id)); btn.disabled = false; btn.textContent = '추가'; return; }
      done((meta && meta.title) || '');

  /* ---------- drive helpers ---------- */
  function setProgress(text, frac) { var p = $('progress'); if (text == null) { p.hidden = true; return; } p.hidden = false; $('progressText').textContent = text; $('progressBar').style.width = Math.round(Math.max(0, Math.min(1, frac || 0)) * 100) + '%'; }
  function listAll(drive, parentId, extra) {
    var out = [];
    function page(token) {
      var input = { query: "parentId = '" + parentId + "'" + (extra || ''), excludeContentSnippets: true, pageSize: 100 };
      if (token) input.pageToken = token;
      return drive.search_files(input).then(function (res) { var files = (res && res.files) || []; out = out.concat(files); if (res && res.nextPageToken && files.length) return page(res.nextPageToken); return out; });
    }
    return page(null);
  }
  function studentFromFolder(sub, parentName) { var s = sub; if (parentName) s = s.split(parentName).join(' '); s = s.replace(/[_\-–·|]+/g, ' ').replace(/\s+/g, ' ').trim(); return s || sub; }
  function parseDue(title) {
    var m = String(title || '').match(/(\d{1,2})\s*[.\/\-월]\s*(\d{1,2})/); if (!m) return '';
    var now = new Date(); var y = now.getFullYear(); var mo = parseInt(m[1], 10); var da = parseInt(m[2], 10);
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return '';
    var d = new Date(Date.UTC(y, mo - 1, da)); var diff = (d.getTime() - now.getTime()) / 86400000;
    if (diff > 120) y -= 1; if (diff < -240) y += 1;
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(da).padStart(2, '0');
  }
  function contains(title, pat) { return !!pat && String(title || '').toLowerCase().indexOf(pat.toLowerCase()) >= 0; }

  /* ---------- roster + assignments ---------- */
  function scanFolder(drive, c, folder) {
    // returns {students:[], assignments:[], docs:[]}
    return listAll(drive, folder.id).then(function (items) {
      var students = []; var docs = []; var materials = null; var subs = [];
      items.forEach(function (it) {
        if (it.mimeType === FOLDER) {
          if (contains(it.title, c.materialsPattern) && !materials) { materials = it; return; }
          if (c.exclude.some(function (x) { return x && contains(it.title, x); })) return;
          subs.push(it);
        } else if (it.mimeType === GDOC) {
          docs.push({ id: it.id, title: it.title, modifiedTime: it.modifiedTime, viewUrl: it.viewUrl, student: it.owner ? String(it.owner).split('@')[0] : '', folderId: folder.id, folderName: folder.name || '', subfolder: '', subfolderId: '', subfolderUrl: '' });
        }
      });
      var chain = Promise.resolve();
      subs.forEach(function (sub) {
        var name = studentFromFolder(sub.title, folder.name);
        students.push({ name: name, folderId: sub.id, folderName: sub.title, url: sub.viewUrl || ('https://drive.google.com/drive/folders/' + sub.id) });
        chain = chain.then(function () { return listAll(drive, sub.id); }).then(function (ds) {
          ds.forEach(function (d) { if (d.mimeType !== GDOC) return; docs.push({ id: d.id, title: d.title, modifiedTime: d.modifiedTime, viewUrl: d.viewUrl, student: name, folderId: folder.id, folderName: folder.name || '', subfolder: sub.title, subfolderId: sub.id, subfolderUrl: sub.viewUrl || '' }); });
        });
      });
      var assignments = [];
      if (materials) {
        chain = chain.then(function () { return listAll(drive, materials.id); }).then(function (ms) {
          var hw = ms.filter(function (x) { return x.mimeType === FOLDER && contains(x.title, c.homeworkPattern); })[0];
          if (!hw) return;
          return listAll(drive, hw.id).then(function (as) {
            var ac = Promise.resolve();
            as.filter(function (x) { return x.mimeType === FOLDER; }).forEach(function (af) {
              var a = { id: af.id, name: af.title, due: parseDue(af.title), url: af.viewUrl || ('https://drive.google.com/drive/folders/' + af.id), docs: [], prompt: '' };
              assignments.push(a);
              ac = ac.then(function () { return listAll(drive, af.id); }).then(function (pd) {
                a.docs = pd.filter(function (x) { return x.mimeType === GDOC; }).map(function (x) { return { id: x.id, title: x.title }; });
                var recent = a.due && (Date.now() - new Date(a.due).getTime()) < 60 * 86400000;
                if (!recent || !a.docs.length) return;
                return drive.read_file_content({ fileId: a.docs[0].id }).then(function (res) { a.prompt = ((res && res.fileContent) || '').trim().slice(0, 2000); }).catch(function () {});
              });
            });
            return ac;
          });
        });
      }
      return chain.then(function () { return { students: students, assignments: assignments, docs: docs }; });
    });
  }

  /* ---------- review run ---------- */
  function buildPrompt(c, doc, text, assignments) {
    var alist = assignments.length ? assignments.map(function (a) { return '- id: ' + a.id + ' | 이름: ' + a.name + (a.due ? ' | 마감: ' + a.due : '') + (a.docs.length ? ' | 과제 문서: ' + a.docs.map(function (d) { return d.title; }).join(', ') : '') + (a.prompt ? ' | 과제 내용: ' + a.prompt.replace(/\s+/g, ' ').slice(0, 400) : ''); }).join('\n') : '(등록된 과제 없음)';
    return c.rubric + '\n\n--- 이 과목의 과제 목록 (교사가 만든 Due 폴더) ---\n' + alist + '\n\n' +
      '--- 문서 정보 ---\n학생: ' + (doc.student || '(알 수 없음)') + '\n문서 제목: ' + doc.title + '\n과목: ' + (doc.folderName || '') + '\n제출(수정) 시각: ' + fmt(doc.modifiedTime) + ' KST\n\n--- 문서 내용 시작 ---\n' + text + '\n--- 문서 내용 끝 ---\n\n' +
      '먼저 이 문서가 위 과제 목록 중 어느 과제의 답인지 판단하세요 (문서 제목, 내용, 제출 시각과 마감일을 비교. 학생이 결석 등으로 늦게 낼 수 있으니 날짜보다 내용을 우선). 확신이 없으면 null.\n' +
      '반드시 아래 형식의 JSON 객체 하나만 출력하세요. 다른 텍스트나 코드펜스는 넣지 마세요.\n' +
      '{"assignmentId": "위 목록의 id 또는 null", "score": 0에서 10 사이 정수, "completeness": "complete" | "partial" | "empty", "summary": "교사가 한눈에 볼 한 문장 (60자 이내)", ' +
      '"strengths": ["구체적인 잘한 점", ...], "improvements": ["구체적인 고칠 점과 고치는 방법", ...], "nextSteps": ["학생에게 줄 다음 과제·행동 1~3개"], ' +
      '"flags": ["미완성" | "과제와 무관" | "AI 작성 의심" | "표절 의심" 등 해당하는 것만, 없으면 빈 배열], "comment": "학생에게 그대로 전달해도 되는 3~5문장 코멘트 (한국어)"}';
  }
  function runReview(source, onlyIds, folderIds) {
    if (state.running) return;
    if (!(state.db && state.mcp && state.sample)) { toast('이 화면에서는 리뷰를 실행할 수 없습니다.'); return; }
    var c = cfg(); if (!c.folders.length) { openSettings(); toast('먼저 과목 폴더를 추가하세요.'); return; }
    state.running = true; render();
    var db = state.db;
    var runId = 'run_' + new Date().toISOString().replace(/[:.]/g, '-');
    var run = { id: runId, source: source, startedAt: new Date().toISOString(), status: 'running', checked: 0, reviewed: 0, skipped: 0, errors: [] };
    var drive = null; var candidates = []; var assignByFolder = {};
    setProgress('폴더를 읽는 중…', 0.02);
    db.doc('runs/' + runId).set(run).catch(function () {});
    var targets = folderIds ? c.folders.filter(function (f) { return folderIds.indexOf(f.id) >= 0; }) : c.folders;
    if (onlyIds) { targets = c.folders.filter(function (f) { return onlyIds.some(function (id) { var r = state.reviews[id]; return r && inFolder(r, f); }); }); }
    state.mcp.server(DRIVE).then(function (d) {
      drive = d; var chain = Promise.resolve(); var i = 0;
      targets.forEach(function (folder) {
        chain = chain.then(function () { i += 1; setProgress('폴더 읽는 중 ' + i + '/' + targets.length + ' · ' + label(folder), 0.05 + 0.25 * (i / targets.length)); return scanFolder(drive, c, folder); }).then(function (res) {
          assignByFolder[folder.id] = res.assignments;
          candidates = candidates.concat(res.docs);
          var now = new Date().toISOString();
          return Promise.all([
            db.doc('roster/' + folder.id).set({ folderId: folder.id, folderName: folder.name, students: res.students, updatedAt: now }),
            db.doc('assignments/' + folder.id).set({ folderId: folder.id, folderName: folder.name, items: res.assignments, updatedAt: now })
          ]).catch(function (e) { run.errors.push({ title: label(folder), message: '명단/과제 저장 실패: ' + e.message }); });
        }).catch(function (e) { run.errors.push({ title: label(folder), message: (e && e.message) || String(e) }); });
      });
      return chain;
    }).then(function () {
      var since = Date.now() - c.sinceDays * 86400000;
      var recent = onlyIds ? candidates.filter(function (d) { return onlyIds.indexOf(d.id) >= 0; }) : candidates.filter(function (d) { return d.modifiedTime && new Date(d.modifiedTime).getTime() >= since; });
      run.checked = recent.length;
      var todo = onlyIds ? recent : recent.filter(function (d) { var prev = state.reviews[d.id]; return !prev || !prev.modifiedTime || String(prev.modifiedTime) < String(d.modifiedTime); });
      run.skipped = recent.length - todo.length;
      // backfill assignment on existing reviews that lack one
      var fills = [];
      recent.forEach(function (d) {
        var prev = state.reviews[d.id]; if (!prev || prev.assignmentId || todo.indexOf(d) >= 0) return;
        var g = guessAssignment(assignByFolder[d.folderId] || [], prev.modifiedTime); if (!g) return;
        fills.push(db.doc('reviews/' + d.id).update({ assignmentId: g.id, assignmentName: g.name, assignmentDue: g.due, folderId: d.folderId, subfolderId: d.subfolderId, subfolderUrl: d.subfolderUrl }).catch(function () {}));
      });
      if (!todo.length) { setProgress('새로 제출되거나 수정된 문서가 없습니다.', 1); return Promise.all(fills); }
      var i = 0; var chain = Promise.resolve();
      todo.forEach(function (doc) {
        chain = chain.then(function () {
          i += 1; setProgress('리뷰 중 ' + i + '/' + todo.length + ' · ' + (doc.student ? doc.student + ' · ' : '') + doc.title, 0.3 + 0.7 * ((i - 0.5) / todo.length));
          return reviewOne(drive, c, doc, source, assignByFolder[doc.folderId] || []).then(function () { run.reviewed += 1; }).catch(function (e) { run.errors.push({ title: (doc.student ? doc.student + ' · ' : '') + doc.title, message: (e && e.message) || String(e) }); });
        });
      });
      return chain.then(function () { return Promise.all(fills); }).then(function () { setProgress('완료: ' + run.reviewed + '건 리뷰' + (run.errors.length ? ', 오류 ' + run.errors.length + '건' : ''), 1); });
    }).catch(function (e) {
      run.errors.push({ title: '실행', message: (e && e.message) || String(e) });
      setProgress('실행 중 오류: ' + ((e && e.message) || e), 1);
      if (e && e.code === 'needs_reauth') notice('구글 드라이브 연결을 다시 승인해야 합니다. claude.ai 설정 › 커넥터에서 Google Drive를 다시 연결하세요.', true);
    }).then(function () {
      run.finishedAt = new Date().toISOString(); run.status = 'done'; state.running = false;
      setTimeout(function () { setProgress(null); }, 6000);
      return db.doc('runs/' + runId).set(run).catch(function () {});
    }).then(function () { render(); if (run.reviewed) toast(run.reviewed + '건 리뷰를 저장했습니다.'); else if (run.errors.length) toast('오류 ' + run.errors.length + '건: ' + run.errors[0].message, 6000); });
  }
  function reviewOne(drive, c, doc, source, assignments) {
    var prev = state.reviews[doc.id];
    var base = {
      fileId: doc.id, title: doc.title, student: doc.student || '', folderId: doc.folderId || '', folderName: doc.folderName || '', subfolder: doc.subfolder || '', subfolderId: doc.subfolderId || '', subfolderUrl: doc.subfolderUrl || '',
      viewUrl: doc.viewUrl || ('https://docs.google.com/document/d/' + doc.id + '/edit'), modifiedTime: doc.modifiedTime, reviewedAt: new Date().toISOString(), source: source,
      revision: prev ? (prev.revision || 1) + 1 : 1, seen: false
    };
    var setAssignment = function (obj, id) {
      var a = null; if (id) a = assignments.filter(function (x) { return x.id === id; })[0] || null;
      if (!a) a = guessAssignment(assignments, doc.modifiedTime);
      obj.assignmentId = a ? a.id : ''; obj.assignmentName = a ? a.name : ''; obj.assignmentDue = a ? a.due : ''; return obj;
    };
    return drive.read_file_content({ fileId: doc.id }).then(function (res) {
      var text = (res && typeof res.fileContent === 'string') ? res.fileContent.trim() : '';
      base.wordCount = text ? text.split(/\s+/).length : 0;
      if (text.length < c.minChars) {
        return setAssignment(Object.assign(base, { status: 'empty', score: null, completeness: 'empty', summary: '문서에 내용이 거의 없습니다 (' + text.length + '자).', strengths: [], improvements: ['문서를 열어 과제를 작성해야 합니다.'], nextSteps: [], flags: ['미완성'], comment: '' }), null);
      }
      var MAX = 60000; if (text.length > MAX) text = text.slice(0, MAX) + '\n[... 이후 내용은 길이 제한으로 생략됨 ...]';
      return state.sample.json(buildPrompt(c, doc, text, assignments), { modelTier: 'default', cache: false }).then(function (j) {
        j = j || {}; var sc = parseInt(j.score, 10);
        return setAssignment(Object.assign(base, {
          status: 'reviewed', score: isNaN(sc) ? null : Math.max(0, Math.min(10, sc)),
          completeness: ['complete', 'partial', 'empty'].indexOf(j.completeness) >= 0 ? j.completeness : 'complete',
          summary: String(j.summary || '').slice(0, 200), strengths: arr(j.strengths), improvements: arr(j.improvements), nextSteps: arr(j.nextSteps), flags: arr(j.flags), comment: String(j.comment || '')
        }), typeof j.assignmentId === 'string' ? j.assignmentId : null);
      });
    }).then(function (review) { return state.db.doc('reviews/' + doc.id).set(review); });
  }
  function arr(x) { return Array.isArray(x) ? x.map(function (s) { return String(s); }).filter(Boolean).slice(0, 12) : []; }
})();
</script>
